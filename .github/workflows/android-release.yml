name: Android APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -n "$SDK_MANAGER" ]; then
            echo "$(dirname "$SDK_MANAGER")" >> "$GITHUB_PATH"
            "$SDK_MANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          elif [ -d "$SDK_ROOT/platforms/android-36" ] && [ -d "$SDK_ROOT/build-tools/36.0.0" ]; then
            echo "Required Android SDK components are already installed."
          else
            echo "Android SDK manager or required Android 36 components not found under $SDK_ROOT." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Name APK for download
        if: startsWith(github.ref, 'refs/tags/')
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Ride-${GITHUB_REF_NAME}.apk"

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: RIDE Android ${{ github.ref_name }}
          generate_release_notes: true
          files: Ride-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
