services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ride
      POSTGRES_USER: ride
      POSTGRES_PASSWORD: ride_dev_only
    ports:
      - "5432:5432"
    volumes:
      - ride_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ride -d ride"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ride_postgres_data:
